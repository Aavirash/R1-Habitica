<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
<title>Habitica for R1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:240px;height:282px;overflow:hidden;background:#1E2329;color:#fff;font-family:-apple-system,system-ui,sans-serif;font-size:13px;user-select:none;-webkit-user-select:none}
body{position:relative}

/* Auth */
#auth{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:8px}
#auth h1{font-size:20px;color:#24CC8F;margin-bottom:4px}
#auth p{font-size:11px;color:#8899aa;text-align:center;margin-bottom:8px;line-height:1.4}
#auth input{width:100%;padding:8px 10px;border:1px solid #3a424e;border-radius:6px;background:#2a303a;color:#fff;font-size:12px;outline:none}
#auth input:focus{border-color:#24CC8F}
#auth button{width:100%;padding:8px;border:none;border-radius:6px;background:#24CC8F;color:#1E2329;font-weight:bold;font-size:13px;cursor:pointer}
#auth .error{color:#DF5A5A;font-size:11px;display:none}
#auth .hint{font-size:10px;color:#667788;text-align:center}

#stats{display:flex;flex-direction:column;padding:3px 8px 2px;gap:2px;border-bottom:1px solid #2a303a;flex-shrink:0}
.stat-row{display:flex;align-items:center;gap:4px;font-size:10px;height:12px}
.stat-bar{flex:1;height:8px;border-radius:4px;background:#2a303a;overflow:hidden;position:relative}
.stat-bar-fill{height:100%;border-radius:4px;transition:width .3s}
.hp-fill{background:linear-gradient(90deg,#DF5A5A,#e87373)}
.xp-fill{background:linear-gradient(90deg,#2995C0,#4db8e0)}
.stat-text{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:7px;color:#fff;white-space:nowrap}
.stat-meta{display:flex;justify-content:space-between;font-size:10px;color:#8899aa;height:14px;align-items:center}
.stat-meta span{display:flex;align-items:center;gap:3px}
.stat-meta .gold{color:#EECB6B}
.stat-meta .level{color:#a78bfa}
.stat-meta .mp{color:#2995C0}
.charge{color:#DF5A5A;font-size:9px;margin-left:auto}

/* App screen (overlay) */
#appScreen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column}

/* Tab bar */
#tabs{display:flex;flex-shrink:0;border-bottom:1px solid #2a303a;background:#1a1f26}
.tab{flex:1;text-align:center;padding:5px 0;font-size:10px;font-weight:600;color:#667788;cursor:pointer;transition:color .2s,border-color .2s;border-bottom:2px solid transparent}
.tab.active{color:#24CC8F;border-bottom-color:#24CC8F}

/* Content */
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 0;-webkit-overflow-scrolling:touch}
#content::-webkit-scrollbar{width:3px}
#content::-webkit-scrollbar-thumb{background:#3a424e;border-radius:2px}

/* Task items */
.task{display:flex;align-items:center;padding:5px 8px;min-height:32px;border-bottom:1px solid #252b33;cursor:pointer;transition:background .15s}
.task:active{background:#2a303a}
.task .check{width:16px;height:16px;border-radius:50%;border:2px solid #3a424e;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;margin-right:6px;transition:all .2s}
.task .check.done{background:#24CC8F;border-color:#24CC8F}
.task .check.done::after{content:'✓';color:#1E2329;font-weight:bold}
.task .body{flex:1;min-width:0;line-height:1.3}
.task .name{font-size:12px;color:#e0e4e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .name.done{text-decoration:line-through;color:#667788}
.task .notes{font-size:9px;color:#667788;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .actions{display:flex;gap:3px;flex-shrink:0;margin-left:4px}
.task .actions button{width:22px;height:22px;border:none;border-radius:50%;font-size:12px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
.task .btn-up{background:#24CC8F20;color:#24CC8F;border:1px solid #24CC8F40}
.task .btn-up:active{background:#24CC8F40}
.task .btn-down{background:#DF5A5A20;color:#DF5A5A;border:1px solid #DF5A5A40}
.task .btn-down:active{background:#DF5A5A40}
.task .reward-cost{padding:2px 6px;border-radius:4px;background:#EECB6B20;color:#EECB6B;font-size:10px;font-weight:600;flex-shrink:0}
.task .streak{font-size:9px;color:#667788;margin-left:4px;flex-shrink:0}
.task .value-dot{width:3px;height:3px;border-radius:50%;margin-left:4px;flex-shrink:0}
.task .priority{font-size:9px;color:#667788;padding:1px 4px;border-radius:3px;background:#2a303a;flex-shrink:0;margin-left:4px}

/* Loading / Empty / Error */
#loading{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:8px}
#loading .spinner{width:20px;height:20px;border:2px solid #3a424e;border-top-color:#24CC8F;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#empty{display:none;flex:1;align-items:center;justify-content:center;font-size:12px;color:#667788}
#error-msg{display:none;padding:8px;text-align:center;font-size:11px;color:#DF5A5A}
</style>
</head>
<body>
  <!-- Auth screen -->
  <div id="auth">
    <h1>Habitica</h1>
    <p>for Rabbit R1<br>Track habits from your pocket</p>
    <input id="userId" placeholder="User ID" value="e9c2554d-b38b-4cd7-b398-d7308ef21fb5" autocomplete="off">
    <input id="apiToken" type="password" placeholder="API Token" value="91aa553c-d733-4d85-8d87-c54a70476ef8" autocomplete="off">
    <div class="error" id="authError">Connection failed — check your credentials</div>
    <button id="loginBtn">Connect</button>
    <div class="hint">Get User ID &amp; API Token<br>from habitica.com → Settings → API</div>
  </div>

  <!-- App screen -->
  <div id="appScreen">
    <div id="stats"></div>
    <div id="tabs">
      <div class="tab active" data-tab="habit">Habits</div>
      <div class="tab" data-tab="daily">Daily</div>
      <div class="tab" data-tab="todo">Todos</div>
      <div class="tab" data-tab="reward">Rewards</div>
    </div>
    <div id="content"></div>
    <div id="loading"><div class="spinner"></div></div>
    <div id="empty">No tasks here yet!</div>
    <div id="error-msg"></div>
  </div>
</body>

<script>
(function(){
'use strict';

const API = 'https://habitica.com/api/v3';
let userId = localStorage.getItem('habitica_userId') || '';
let apiToken = localStorage.getItem('habitica_apiToken') || '';
let activeTab = 'habit';
let tasks = [];
let userData = null;

const authEl = document.getElementById('auth');
const appEl = document.getElementById('appScreen');
const userIdInput = document.getElementById('userId');
const apiTokenInput = document.getElementById('apiToken');
const loginBtn = document.getElementById('loginBtn');
const authError = document.getElementById('authError');
const statsEl = document.getElementById('stats');
const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');
const loadingEl = document.getElementById('loading');
const emptyEl = document.getElementById('empty');
const errorEl = document.getElementById('error-msg');

// --- HELPERS ---

function showLoading(show) {
  loadingEl.style.display = show ? 'flex' : 'none';
  contentEl.style.display = show ? 'none' : 'block';
  emptyEl.style.display = 'none';
  errorEl.style.display = 'none';
}

function showError(msg) {
  loadingEl.style.display = 'none';
  contentEl.style.display = 'none';
  emptyEl.style.display = 'none';
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
}

function showEmpty() {
  loadingEl.style.display = 'none';
  contentEl.style.display = 'none';
  emptyEl.style.display = 'flex';
  errorEl.style.display = 'none';
}

// --- API ---

function apiHeaders() {
  return {
    'x-api-user': userId,
    'x-api-key': apiToken,
    'x-client': userId + '-R1-Habitica',
    'Content-Type': 'application/json',
  };
}

async function apiGet(path) {
  const res = await fetch(API + path, { headers: apiHeaders() });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function apiPost(path) {
  const res = await fetch(API + path, { method: 'POST', headers: apiHeaders() });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// --- AUTH ---

async function doLogin(id, token) {
  userId = id.trim();
  apiToken = token.trim();
  if (!userId || !apiToken) throw new Error('Missing credentials');
  const data = await apiGet('/user');
  if (!data || !data.data) throw new Error('Invalid response');
  localStorage.setItem('habitica_userId', userId);
  localStorage.setItem('habitica_apiToken', apiToken);
  userData = data.data;
  return userData;
}

function logout() {
  userId = '';
  apiToken = '';
  localStorage.removeItem('habitica_userId');
  localStorage.removeItem('habitica_apiToken');
  userData = null;
  tasks = [];
  authEl.style.display = 'flex';
  appEl.style.display = 'none';
  userIdInput.value = '';
  apiTokenInput.value = '';
}

// --- RENDER ---

function renderStats(u) {
  if (!u) return '';
  const hpPct = Math.round((u.stats.hp / u.stats.maxHP) * 100);
  const xpPct = Math.round((u.stats.exp / u.stats.toNextLevel) * 100);
  const hpBar = `<div class="stat-bar"><div class="stat-bar-fill hp-fill" style="width:${hpPct}%"><span class="stat-text">${Math.round(u.stats.hp)}/${u.stats.maxHP}</span></div></div>`;
  const xpBar = `<div class="stat-bar"><div class="stat-bar-fill xp-fill" style="width:${xpPct}%"><span class="stat-text">${Math.round(u.stats.exp)}/${u.stats.toNextLevel}</span></div></div>`;
  const chargeLvl = u.purchased && u.purchased.plan && u.purchased.plan.consecutive && u.purchased.plan.consecutive.gemCapExtra > 0
    ? `<span class="charge">🔥${u.purchased.plan.consecutive.gemCapExtra + 25}gm</span>`
    : '';
  return `
    <div class="stat-row"><span style="color:#DF5A5A;width:16px;text-align:center">❤</span>${hpBar}</div>
    <div class="stat-row"><span style="color:#2995C0;width:16px;text-align:center">✦</span>${xpBar}</div>
    <div class="stat-meta">
      <span><span class="level">Lv ${u.stats.lvl}</span> ${chargeLvl}</span>
      <span><span class="gold">👑 ${Math.floor(u.stats.gp)}g</span></span>
      <span><span class="mp">💧 ${Math.floor(u.stats.mp)}/${Math.floor(u.stats.maxMP)}</span></span>
    </div>`;
}

function renderTasks(type) {
  const filtered = tasks.filter(t => t.type === type);
  if (type === 'reward') {
    // For rewards, show all (they're not "incomplete" per se)
  }
  if (filtered.length === 0) { showEmpty(); return; }

  let html = '';
  for (const t of filtered) {
    if (type === 'habit') html += renderHabit(t);
    else if (type === 'daily') html += renderDaily(t);
    else if (type === 'todo') html += renderTodo(t);
    else if (type === 'reward') html += renderReward(t);
  }
  contentEl.innerHTML = html;
  contentEl.style.display = 'block';
  loadingEl.style.display = 'none';
  emptyEl.style.display = 'none';
  errorEl.style.display = 'none';
  focusContent();
}

function renderHabit(t) {
  const val = Math.round(t.value * 10) / 10;
  const valColor = val >= 0 ? '#24CC8F' : '#DF5A5A';
  return `<div class="task" data-id="${t._id}" data-type="habit">
    <div class="check" style="border-color:${valColor}"><div class="value-dot" style="background:${valColor};width:8px;height:8px"></div></div>
    <div class="body">
      <div class="name">${esc(t.text)}</div>
      ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ''}
    </div>
    <div class="actions">
      <button class="btn-down" data-action="score-down">−</button>
      <button class="btn-up" data-action="score-up">+</button>
    </div>
  </div>`;
}

function renderDaily(t) {
  const done = t.completed;
  const streak = t.streak || 0;
  return `<div class="task" data-id="${t._id}" data-type="daily">
    <div class="check${done ? ' done' : ''}"></div>
    <div class="body">
      <div class="name${done ? ' done' : ''}">${esc(t.text)}</div>
      ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ''}
    </div>
    ${streak > 0 ? `<span class="streak">🔥${streak}</span>` : ''}
  </div>`;
}

function renderTodo(t) {
  const done = t.completed;
  return `<div class="task" data-id="${t._id}" data-type="todo">
    <div class="check${done ? ' done' : ''}"></div>
    <div class="body">
      <div class="name${done ? ' done' : ''}">${esc(t.text)}</div>
      ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ''}
    </div>
  </div>`;
}

function renderReward(t) {
  return `<div class="task" data-id="${t._id}" data-type="reward">
    <div class="body">
      <div class="name">${esc(t.text)}</div>
    </div>
    <span class="reward-cost">${Math.floor(t.value)}g</span>
  </div>`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// --- LOAD DATA ---

async function loadData() {
  showLoading(true);
  try {
    const [userRes, tasksRes] = await Promise.all([
      apiGet('/user'),
      apiGet('/tasks/user'),
    ]);
    userData = userRes.data;
    tasks = tasksRes.data || [];
    renderStatsBar();
    renderTasks(activeTab);
  } catch (e) {
    showError('Failed to load: ' + (e.message || e));
    // If 401, force re-login
    if (e.message && e.message.includes('401')) logout();
  }
}

function renderStatsBar() {
  if (userData) statsEl.innerHTML = renderStats(userData);
}

function focusContent() {
  if (appEl.style.display === 'flex') contentEl.focus();
}

// --- SCORE TASK ---

async function scoreTask(id, direction) {
  try {
    await apiPost(`/tasks/${id}/score/${direction}`);
    await loadData(); // Refresh
  } catch (e) {
    showError('Failed: ' + (e.message || e));
  }
}

// --- EVENTS (R1 WebView compatible — uses touchend, falls back to click) ---

function handleTouch(el, handler) {
  el.addEventListener('touchend', function(e) {
    e.preventDefault();
    handler(e);
  });
  el.addEventListener('click', function(e) {
    handler(e);
  });
}

// Tab switching helper
function switchTab(name) {
  const tab = document.querySelector('[data-tab="' + name + '"]');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  tab.classList.add('active');
  activeTab = name;
  renderTasks(activeTab);
}

// Task scoring
handleTouch(document.body, function(e) {
  const task = e.target.closest('.task');
  if (!task) return;

  const id = task.dataset.id;
  const type = task.dataset.type;
  const action = e.target.dataset.action;

  if (action === 'score-up') {
    scoreTask(id, 'up');
  } else if (action === 'score-down') {
    scoreTask(id, 'down');
  } else if (type === 'daily' || type === 'todo') {
    scoreTask(id, 'up');
  } else if (type === 'reward') {
    scoreTask(id, 'up');
  } else if (type === 'habit') {
    scoreTask(id, 'up');
  }
});

// Tab switching
handleTouch(tabsEl, function(e) {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  switchTab(tab.dataset.tab);
});

// --- R1 CUSTOM EVENTS (scroll wheel, PTT button) + desktop keyboard fallback ---

var R1_TABS = ['habit', 'daily', 'todo', 'reward'];

function cycleTab(dir) {
  var idx = R1_TABS.indexOf(activeTab);
  switchTab(R1_TABS[(idx + dir + R1_TABS.length) % R1_TABS.length]);
}

function r1Scroll(delta) {
  contentEl.scrollTop = Math.max(0, Math.min(contentEl.scrollTop + delta, contentEl.scrollHeight - contentEl.clientHeight));
}

function scoreFirstTask() {
  var t = contentEl.querySelector('.task:not(.done)') || contentEl.querySelector('.task');
  if (!t) return;
  var id = t.dataset.id, type = t.dataset.type;
  if (type === 'habit' || type === 'daily' || type === 'todo' || type === 'reward') scoreTask(id, 'up');
}

// R1 scroll wheel → scroll
window.addEventListener('scrollUp', function() { r1Scroll(-44); });
window.addEventListener('scrollDown', function() { r1Scroll(44); });

// R1 PTT single click → cycle tabs
window.addEventListener('sideClick', function() { cycleTab(1); });

// R1 PTT long press → mark first task done
window.addEventListener('longPressStart', function() { scoreFirstTask(); });

// Desktop keyboard fallback for testing
document.addEventListener('keydown', function(e) {
  if (appEl.style.display !== 'flex') return;
  if (e.key === 'ArrowRight') { cycleTab(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { cycleTab(-1); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { r1Scroll(44); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { r1Scroll(-44); e.preventDefault(); }
  else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) { scoreFirstTask(); e.preventDefault(); }
});

// Login
handleTouch(loginBtn, async function() {
  authError.style.display = 'none';
  loginBtn.textContent = 'Connecting...';
  loginBtn.disabled = true;
  try {
    const u = await doLogin(userIdInput.value, apiTokenInput.value);
    authEl.style.display = 'none';
    appEl.style.display = 'flex';
    await loadData();
  } catch (e) {
    authError.style.display = 'block';
    authError.textContent = 'Error: ' + (e.message || e);
  }
  loginBtn.textContent = 'Connect';
  loginBtn.disabled = false;
});

// Enter key on inputs
userIdInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') apiTokenInput.focus();
});
apiTokenInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') loginBtn.click();
});

// --- INIT ---

async function init() {
  if (userId && apiToken) {
    authEl.style.display = 'none';
    appEl.style.display = 'flex';
    await loadData();
  } else {
    authEl.style.display = 'flex';
    appEl.style.display = 'none';
    if (userIdInput) userIdInput.value = userId || 'e9c2554d-b38b-4cd7-b398-d7308ef21fb5';
    if (apiTokenInput) apiTokenInput.value = apiToken || '91aa553c-d733-4d85-8d87-c54a70476ef8';
  }
}

init().catch(function(e) {
  console.error(e);
});

})();
</script>
</body>
</html>
